# What actually gets proxied. Shared by the HTTP and HTTPS server blocks so the
# two cannot drift apart.
#
# Deliberately NOT a .template: every variable in here is one of nginx's own
# ($host, $remote_addr, $scheme), and running envsubst over them would blank
# them out. Only the server blocks that need APP_HOSTNAME are templated.

# Attachments and logo uploads. This has a twin in the application --
# APP_ATTACHMENTS_MAX_BYTES -- and raising one without the other means an
# oversized upload is refused by whichever is lower, with the proxy's error
# rather than the application's.
client_max_body_size 25m;

location / {
    proxy_pass http://inventory_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# The actuator is for the container health check and the operator, not for
# whoever can reach the box. Only the internal Docker network and loopback.
location /actuator/ {
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://inventory_app;
    proxy_set_header Host $host;
}
