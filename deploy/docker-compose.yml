# =====================================================================
# Inventory Manager -- three containers, one stack, one VM.
# =====================================================================
# Only the reverse proxy is published. `app` and `postgres` talk over an
# internal network that is not reachable from the host's public interface.
#
# Postgres ships here by default with a documented path to externalize later:
# point DB_HOST at the new instance, restore with the standard runbook, and
# stop starting this service. Nothing in the application assumes the database
# is same-host, which is what keeps that a config change rather than a port.
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Always a real version tag in production, never `latest` -- an admin
    # updating should be choosing a known version, not drifting onto whatever
    # happens to be newest (Deployment Design §7.4).
    image: ${APP_IMAGE:-inventory-manager:0.1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      APP_ATTACHMENTS_DIRECTORY: /var/lib/inventory-manager/attachments
      APP_BACKUPS_DIRECTORY: /var/lib/inventory-manager/backups
    volumes:
      # Attachment bytes live on disk, not in Postgres, so they need a volume
      # of their own -- without one, replacing the container during an update
      # would take every uploaded file with it. backup.sh archives this
      # directory alongside the database dump for the same reason.
      - attachment-data:/var/lib/inventory-manager/attachments
      # Backups taken from Settings > Backups. Its own volume so an update,
      # which recreates the container, does not take them with it.
      - backup-data:/var/lib/inventory-manager/backups
    networks:
      - internal
    # No ports: -- the app is reachable only through the reverse proxy.

  # The other half of the ping-pong. Identical to `app` in every way that
  # matters -- same env, same volumes, same network -- because a version tested
  # in a container configured differently from the one that will serve it has
  # not been tested. The ONLY differences are the image tag, the restart policy
  # and the profile that keeps it stopped when no update is running.
  #
  # It shares the attachment and backup volumes deliberately: both versions must
  # see the same uploaded files, or a swap would lose them.
  app-next:
    image: ${APP_NEXT_IMAGE:-${APP_IMAGE:-inventory-manager:0.1.0}}
    # `no`, not `unless-stopped`: this container only exists during an update.
    # A restart policy would resurrect a half-finished one after a reboot and
    # leave two versions running against one database.
    restart: "no"
    profiles: ["swap"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      APP_ATTACHMENTS_DIRECTORY: /var/lib/inventory-manager/attachments
      APP_BACKUPS_DIRECTORY: /var/lib/inventory-manager/backups
    volumes:
      # Attachment bytes live on disk, not in Postgres, so they need a volume
      # of their own -- without one, replacing the container during an update
      # would take every uploaded file with it. backup.sh archives this
      # directory alongside the database dump for the same reason.
      - attachment-data:/var/lib/inventory-manager/attachments
      # Backups taken from Settings > Backups. Its own volume so an update,
      # which recreates the container, does not take them with it.
      - backup-data:/var/lib/inventory-manager/backups
    networks:
      - internal
    # No ports: -- reached only through the reverse proxy, and only once
    # update.sh has pointed the upstream at it.


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Bound on every interface so the application is reachable from the rest
      # of the network, which is the point of putting it on a VM. Restrict it
      # at the VM's firewall or security group, not here.
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
    environment:
      TLS_MODE: ${TLS_MODE:-none}
      APP_HOSTNAME: ${APP_HOSTNAME:-localhost}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/nginx/certs/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/nginx/certs/privkey.pem}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/app-http.conf.template:/etc/nginx/app-templates/app-http.conf.template:ro
      - ./nginx/app-https.conf.template:/etc/nginx/app-templates/app-https.conf.template:ro
      - ./nginx/app-proxy.conf:/etc/nginx/app-proxy.conf:ro
      # NOT read-only, and the only mount that is not: scripts/update.sh
      # rewrites upstream.conf in here to move traffic between app and
      # app-next, then reloads nginx. Its own directory, ignored by git, so a
      # file that changes on the host never collides with a `git pull`.
      - ./nginx/runtime:/etc/nginx/runtime
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      # Where TLS_MODE=provided looks for an operator-supplied certificate.
      # Harmless when the directory does not exist in the other modes.
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    # Our own entrypoint rather than the image's: it has to choose between the
    # HTTP and TLS configs based on whether a certificate exists, which the
    # image's plain envsubst pass cannot do. See nginx/entrypoint.sh.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    # Only started for `docker compose --profile letsencrypt up -d`. An internal
    # VM has no public hostname to prove ownership of, so leaving certbot
    # running there would retry forever and fill the log with failures for a
    # certificate it can never obtain.
    profiles: ["letsencrypt"]
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renewal is automatic and unattended: there is no command for anyone to
    # remember to run, which is the whole point of pairing certbot with nginx.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres-data:
  attachment-data:
  backup-data:
  certbot-certs:
  certbot-webroot:

networks:
  internal:
    driver: bridge
