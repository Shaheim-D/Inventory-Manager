spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_manager_test}
    username: ${DB_USER:inventory_manager}
    password: ${DB_PASSWORD:inventory_manager}

  flyway:
    # Every test run starts from an empty database and replays V1 onward, so the
    # migrations themselves are exercised on every build -- the project's stated
    # "validate, don't just write" practice, enforced by CI rather than by memory.
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate

app:
  backups:
    # Somewhere disposable. The suite really does run pg_dump and really does
    # write archives, so this must not be the directory a developer's own
    # backups live in.
    directory: ${java.io.tmpdir}/inventory-manager-test-backups
  plugins:
    # Spring's "never" cron. Plugins are exercised by triggering them directly;
    # a background tick firing mid-suite would run whichever test's plugin
    # happened to be enabled at that moment, against a fake server that test had
    # already shut down -- flakiness with nothing to teach.
    tick-cron: "-"

  bootstrap-admin:
    username: admin
    password: BootstrapAdmin123

logging:
  level:
    org.springframework.web: WARN
    org.hibernate: WARN

# Secret references a plugin's configuration can name in tests. Plugins store
# only the name of a variable; these are what those names resolve to here, the
# same way an environment variable would in a deployment.
TEST_ZABBIX_TOKEN: test-zabbix-token
TEST_NETBOX_TOKEN: test-netbox-token
TEST_BIND_PASSWORD: test-bind-password
