name: CI

# Every migration runs against a real PostgreSQL instance on every push. That is
# the project's standing practice -- "validate, don't just write" -- enforced by
# CI from the first commit rather than bolted on later.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (migrations + tests against real PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the version the schema was validated against and the version
        # docker-compose runs. An in-memory substitute would test none of the
        # triggers or CHECK constraints this schema relies on.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_manager_test
          POSTGRES_USER: inventory_manager
          POSTGRES_PASSWORD: inventory_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: inventory_manager_test
          DB_USER: inventory_manager
          DB_PASSWORD: inventory_manager
        run: mvn -B test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t inventory-manager:ci .
